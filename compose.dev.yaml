services:
  frontend:
    image: ${COMPOSE_PROJECT_NAME:-trouve-ton-artisan}-frontend:${APP_DEV_IMAGE_TAG:-development}
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - path: ./frontend/.env
        required: true
      - path: ./frontend/.env.local
        required: false
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5173}:5173
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:5173/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - application
    labels:
      - traefik.enable=false

  backend:
    image: ${COMPOSE_PROJECT_NAME:-trouve-ton-artisan}-backend:${APP_DEV_IMAGE_TAG:-development}
    build:
      target: development
    command: npm run dev
    environment:
      NODE_ENV: development
    ports:
      - 127.0.0.1:${BACKEND_PORT:-3000}:3000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
  backend_node_modules:
