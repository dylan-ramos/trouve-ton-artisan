# Only the explicitly configured Traefik peer can supply a client address/protocol.
geo $realip_remote_addr $trusted_ingress {
    default 0;
    ${TRAEFIK_TRUSTED_IP} 1;
}
map "$trusted_ingress:$http_x_forwarded_proto" $forwarded_scheme {
    default $scheme;
    "1:https" https;
}
map $forwarded_scheme $hsts {
    default "";
    https "max-age=31536000";
}
# No query string, referer, IP or user agent in application access logs.
log_format minimal '$request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout minimal;
    client_max_body_size 32k;
    client_body_timeout 10s;
    send_timeout 30s;

    set_real_ip_from ${TRAEFIK_TRUSTED_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    include /etc/nginx/security-headers.conf;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf|otf)$ {
        include /etc/nginx/security-headers.conf;
        expires 7d;
        try_files $uri =404;
    }
}
